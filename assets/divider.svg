<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="10" viewBox="0 0 1200 10" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2B340" stop-opacity="0"/>
      <stop offset="25%" stop-color="#E2B340" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B8CF8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#E2B340" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E2B340" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3.5" width="1200" height="3" rx="1.5" fill="url(#base)"/>
  <g>
    <rect x="0" y="3" width="220" height="4" rx="2" fill="url(#pulse)">
      <animateTransform attributeName="transform" type="translate" values="-260 0; 1260 0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
