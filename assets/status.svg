<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Project status: auth, marketplace, reviews and IPFS complete; payments and tests in progress">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2B340"/>
      <stop offset="100%" stop-color="#F0D060"/>
    </linearGradient>
    <linearGradient id="barWip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B8CF8"/>
      <stop offset="100%" stop-color="#B44BF5"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2B340"/>
      <stop offset="100%" stop-color="#8B8CF8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="470" rx="16" fill="#0C0F1A" stroke="#E2B340" stroke-opacity="0.2"/>
  <text x="30" y="44" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="url(#head)">📊 Project Status</text>
  <text x="970" y="44" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748B">last updated: v1.0</text>

  <!-- row generator: label, pct, y, color -->
  <!-- 1 -->
  <text x="30" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">Auth, roles &amp; OTP</text>
  <rect x="300" y="74" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="74" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" from="0" to="620" dur="1.1s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="975" y="93" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0D060">100%</text>
  <!-- 2 -->
  <text x="30" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">Marketplace &amp; listings</text>
  <rect x="300" y="120" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="120" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" from="0" to="620" dur="1.1s" begin="0.35s" fill="freeze"/>
  </rect>
  <text x="975" y="139" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0D060">100%</text>
  <!-- 3 -->
  <text x="30" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">Reviews &amp; moderation</text>
  <rect x="300" y="166" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="166" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" from="0" to="620" dur="1.1s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="975" y="185" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0D060">100%</text>
  <!-- 4 -->
  <text x="30" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">IPFS storage (Pinata)</text>
  <rect x="300" y="212" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="212" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" from="0" to="620" dur="1.1s" begin="0.65s" fill="freeze"/>
