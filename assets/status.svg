  <text x="975" y="277" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0D060">100%</text>
  <!-- 6 -->
  <text x="30" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">Checkout (test mode)</text>
  <rect x="300" y="304" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="304" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" from="0" to="496" dur="1.1s" begin="0.95s" fill="freeze"/>
  </rect>
  <text x="975" y="323" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0D060">80%</text>
  <!-- 7 -->
  <text x="30" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">API-key manager UI</text>
  <rect x="300" y="350" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="350" width="0" height="26" rx="13" fill="url(#barWip)">
    <animate attributeName="width" from="0" to="186" dur="1.1s" begin="1.1s" fill="freeze"/>
  </rect>
  <text x="975" y="369" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#A78BFA">30%</text>
  <!-- 8 -->
  <text x="30" y="414" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">Real payments &amp; tests</text>
  <rect x="300" y="396" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="396" width="0" height="26" rx="13" fill="url(#barWip)">
    <animate attributeName="width" from="0" to="140" dur="1.1s" begin="1.25s" fill="freeze"/>
  </rect>
  <text x="975" y="415" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#A78BFA">~20%</text>

  <text x="30" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Gold = shipped &#183; Purple = work in progress &#183; see Roadmap for details</text>
