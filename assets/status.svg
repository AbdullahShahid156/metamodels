  <text x="975" y="231" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F0D060">100%</text>
  <!-- 5 -->
  <text x="30" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1">Seller &amp; admin dashboards</text>
  <rect x="300" y="258" width="620" height="26" rx="13" fill="#1C2035"/>
  <rect x="300" y="258" width="0" height="26" rx="13" fill="url(#bar)">
    <animate attributeName="width" from="0" to="620" dur="1.1s" begin="0.8s" fill="freeze"/>
